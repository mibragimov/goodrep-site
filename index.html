<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goodrep</title>
<meta name="description" content="Goodrep is a workout tracker for iPhone: log sets, time your rest, see your progress. Your data stays on your device and in your iCloud.">
<style>
:root { color-scheme: light dark; --bg: #ffffff; --text: #111114; --muted: #5c5c66; --accent: #c2410c; --rule: #d1d1d6; }
@media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #f5f5f7; --muted: #a1a1aa; --accent: #ff7a45; --rule: #38383a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
       -webkit-text-size-adjust: 100%; }
main { max-width: 42rem; margin: 0 auto; padding: 2rem 16px 4rem; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.5rem; }
h2 { font-size: 1.3rem; margin: 2.2rem 0 0.6rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
h3 { font-size: 1.05rem; margin: 1.6rem 0 0.4rem; }
p, li { overflow-wrap: anywhere; }
ul, ol { padding-left: 1.4rem; }
li { margin: 0.35rem 0; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Goodrep</h1>
<p>A workout tracker for iPhone. Log sets, time your rest, see your progress. Your data stays on your device and in your own iCloud; there are no accounts, ads or tracking.</p>
<ul>
<li><a href="/support">Support</a></li>
<li><a href="/privacy">Privacy policy</a></li>
</ul>
<p>Questions: <a href="mailto:support@goodrep.fitness">support@goodrep.fitness</a></p>
</main>
</body>
</html>
